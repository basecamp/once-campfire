default: &default
  store_options:
    max_age: <%= 30.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

performance:
  database: cache
  <<: *default

production:
  database: <%= ENV.fetch("DATABASE", "cache") %>
  <<: *default
