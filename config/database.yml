# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 10 } %>
  timeout: 5000
  default_transaction_mode: immediate
  # Checkpoint on a background connection instead (SqliteWalCheckpoint).
  # Non-test processes start a contender; forking servers stop before fork and
  # start again in the child so the flock is never inherited.
  pragmas:
    wal_autocheckpoint: 0

development:
  primary:
    <<: *default
    database: storage/db/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: storage/db/test.sqlite3

performance:
  primary:
    <<: *default
    database: storage/db/performance.sqlite3

  queue:
    <<: *default
    database: storage/db/performance_queue.sqlite3
    pool: 5
    migrations_paths: db/queue_migrate
    schema_dump: queue_schema.rb
    pragmas:
      wal_autocheckpoint: 1000

production:
  primary:
    <<: *default
    database: storage/db/production.sqlite3

  queue:
    <<: *default
    database: storage/db/production_queue.sqlite3
    # Three worker execution threads plus the polling and heartbeat threads.
    pool: 5
    migrations_paths: db/queue_migrate
    schema_dump: queue_schema.rb
    # The background checkpoint contender tracks the primary database; keep
    # SQLite's normal checkpointing for queue writes.
    pragmas:
      wal_autocheckpoint: 1000
